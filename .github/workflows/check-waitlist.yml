name: Check UCAM waitlist

on:
  # Scheduling is external: cron-job.org calls the workflow_dispatch API on a schedule
  # (hourly 08:00-20:00 Europe/Madrid, Mon-Fri) because GitHub's built-in cron proved
  # unreliable (delayed/dropped runs). Kept dispatch-only so manual "Run workflow" still works.
  # The in-app active-hours gate + TZ=Europe/Madrid remain as a safety net.
  workflow_dispatch: {}

concurrency:
  group: ucam-waitlist
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Madrid
      # Secrets -> configuration (double underscore = section separator)
      Portal__Username: ${{ secrets.PORTAL_USERNAME }}
      Portal__Password: ${{ secrets.PORTAL_PASSWORD }}
      Telegram__BotToken: ${{ secrets.TELEGRAM_BOTTOKEN }}
      Telegram__ChatId: ${{ secrets.TELEGRAM_CHATID }}
      # One-shot behaviour for a scheduled runner
      Worker__RunOnce: 'true'
      Worker__NotifyOnStartup: 'false'
      Worker__MaxJitter: '00:00:00'
      Worker__StateFilePath: 'data/last-position.json'
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet and Playwright browsers
        uses: actions/cache@v6
        with:
          path: |
            ~/.nuget/packages
            ~/.cache/ms-playwright
          key: deps-${{ runner.os }}-${{ hashFiles('**/UcamWaitlistBot.csproj') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Build
        run: dotnet build -c Release

      - name: Install Chromium
        run: pwsh bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run one check
        run: dotnet bin/Release/net10.0/UcamWaitlistBot.dll

      - name: Persist state
        if: always()
        run: |
          if [ -n "$(git status --porcelain data/last-position.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/last-position.json
            git commit -m "chore: update waitlist state [skip ci]"
            git push
          else
            echo "No state change."
          fi
